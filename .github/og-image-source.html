<!doctype html>
<!--
  Source for public/og-image.png (the social sharing card).

  This file is not part of the build. To regenerate the PNG after editing it:

    chromium --headless --no-sandbox --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 \
      --screenshot=public/og-image.png .github/og-image-source.html

  Keep the output at exactly 1200x630 — index.html declares those dimensions in
  its og:image:width / og:image:height tags.
-->

<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { width:1200px; height:630px; background:#ecfdf5; }
  body { width:1200px; height:630px; }
  body {
    background: linear-gradient(135deg, #ecfdf5 0%, #f0fdfa 60%, #f8fffd 100%);
    font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif;
    display:flex; flex-direction:column; justify-content:center;
    padding: 0 76px; position:relative; overflow:hidden;
  }
  .bar { position:absolute; top:0; left:0; right:0; height:14px;
    background: linear-gradient(90deg,#34d399,#0d9488); }
  .row { display:flex; align-items:center; gap:22px; margin-bottom:34px; }
  .mark { width:88px; height:88px; border-radius:22px;
    background: linear-gradient(135deg,#34d399,#0d9488);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 18px 40px rgba(13,148,136,.32); }
  .mark svg { width:50px; height:50px; }
  h1 { font-size:74px; font-weight:800; letter-spacing:-2.5px; color:#0f172a; line-height:1; }
  p.tag { font-size:35px; color:#334155; font-weight:600; line-height:1.35; max-width:720px; }
  p.sub { font-size:24px; color:#64748b; margin-top:26px; font-weight:500; }
  .chips { display:flex; gap:14px; margin-top:34px; }
  .chip { font-size:20px; font-weight:700; color:#0f766e; background:#d1fae5;
    border:2px solid #a7f3d0; border-radius:999px; padding:10px 22px; }
  .art { position:absolute; right:70px; top:186px;
    display:grid; grid-template-columns:repeat(8,30px); grid-template-rows:repeat(8,30px);
    gap:4px; opacity:.95; transform: rotate(-5deg);
    box-shadow: 0 22px 50px rgba(15,23,42,.16); border-radius:10px; padding:10px; background:#fff; }
  .art i { border-radius:4px; background:#e2e8f0; }
</style></head><body>
  <div class="bar"></div>
  <div class="row">
    <div class="mark">
      <svg viewBox="0 0 24 26" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 2h8l4 4v16a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/>
        <path d="M10 2v5h4"/><line x1="1" y1="11" x2="14" y2="11"/>
        <line x1="1" y1="16" x2="14" y2="16"/><line x1="8" y1="11" x2="8" y2="23"/>
      </svg>
    </div>
    <h1>Sheets Quest</h1>
  </div>
  <p class="tag">Turn pixel art into interactive quiz spreadsheets.</p>
  <p class="sub">Students answer questions &mdash; the hidden picture reveals itself.</p>
  <div class="chips"><span class="chip">Excel</span><span class="chip">Google Sheets</span><span class="chip">Free for teachers</span></div>
  <div class="art" id="art"></div>
  <script>
    // A small heart-ish sprite so the card shows what the tool actually produces.
    const P = [
      "00110110","01111111","01111111","01111111","00111110","00011100","00001000","00000000"
    ];
    const on = ["#10b981","#14b8a6","#34d399"];
    const art = document.getElementById('art');
    P.forEach((row,y) => [...row].forEach((c,x) => {
      const i = document.createElement('i');
      if (c === '1') i.style.background = on[(x+y) % on.length];
      art.appendChild(i);
    }));
  </script>
</body></html>
